{% extends "base.html" %}

{% block title %}Add New Student{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white py-3">
                <h5 class="mb-0"><i class="bi bi-person-plus-fill me-2"></i>Add New Student Record</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('add_student') }}">
                    <div class="mb-3">
                        <label for="roll_no" class="form-label fw-semibold">Roll Number / Registration No:</label>
                        <input type="text" class="form-control" id="roll_no" name="roll_no" value="{{ form.roll_no or '' }}" placeholder="e.g. 2024CS102" required>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Student Full Name:</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ form.name or '' }}" placeholder="e.g. Sarah Connor" required>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-semibold">Department:</label>
                        <select class="form-select" id="department" name="department" required>
                            <option value="">-- Select Department --</option>
                            {% for dept in departments %}
                            <option value="{{ dept }}" {% if form.department == dept %}selected{% endif %}>{{ dept }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address:</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ form.email or '' }}" placeholder="e.g. sarah@college.edu" required>
                    </div>

                    <div class="mb-4">
                        <label for="gpa" class="form-label fw-semibold">GPA (0.0 to 10.0):</label>
                        <input type="number" step="0.01" min="0" max="10" class="form-control" id="gpa" name="gpa" value="{{ form.gpa or '' }}" placeholder="e.g. 8.75" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">&larr; Back to List</a>
                        <button type="submit" class="btn btn-success px-4"><i class="bi bi-save me-1"></i> Save Student</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
