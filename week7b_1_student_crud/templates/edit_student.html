{% extends "base.html" %}

{% block title %}Edit Student Details{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-warning bg-gradient text-dark py-3">
                <h5 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Student Information</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('edit_student', id=student.id) }}">
                    <div class="mb-3">
                        <label for="roll_no" class="form-label fw-semibold">Roll Number / Registration No:</label>
                        <input type="text" class="form-control" id="roll_no" name="roll_no" value="{{ student.roll_no }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Student Full Name:</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ student.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-semibold">Department:</label>
                        <select class="form-select" id="department" name="department" required>
                            {% for dept in departments %}
                            <option value="{{ dept }}" {% if student.department == dept %}selected{% endif %}>{{ dept }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address:</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ student.email }}" required>
                    </div>

                    <div class="mb-4">
                        <label for="gpa" class="form-label fw-semibold">GPA (0.0 to 10.0):</label>
                        <input type="number" step="0.01" min="0" max="10" class="form-control" id="gpa" name="gpa" value="{{ student.gpa }}" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">&larr; Cancel</a>
                        <button type="submit" class="btn btn-warning px-4"><i class="bi bi-check-circle me-1"></i> Update Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
